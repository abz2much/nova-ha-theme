  # Fonts, shape and card-mod: the same in any mode.
  primary-font-family: "'Manrope', -apple-system, 'Segoe UI', sans-serif"  # older cards and the frontend still read this
  code-font-family: "'IBM Plex Mono', 'SF Mono', monospace"
  ha-font-family-body: "'Manrope', -apple-system, 'Segoe UI', sans-serif"

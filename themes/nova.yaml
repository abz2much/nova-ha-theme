      }
      :host-context(ha-card) ha-card {
        background: var(--ha-card-background, var(--card-background-color));
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        border: 0;
        box-shadow: none;
      }
    }
    ha-card:hover {
      border-color: #8fffe070;
      box-shadow: 0 0 18px 1px #8fffe022;
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon) {
      transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease;
      cursor: pointer;
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -14px var(--accent-color), 0 0 0 1px color-mix(in srgb, var(--accent-color) 50%, transparent);
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):active {
      transform: translateY(0) scale(.985);
      box-shadow: 0 4px 12px -8px var(--accent-color);
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon), ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):hover, ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):active {
        transform: none;
        transition: none;
      }
    }


# Nova: a Home Assistant frontend theme, 12 colour themes from Nova's panel (plus "Nova", an alias of Deep Teal)
#
# GENERATED by scripts/generate-theme.mjs. Do not edit by hand; change the
# generator and run it again (node scripts/generate-theme.mjs).
#
# Each theme is two seed colours, a base and an accent, taken from Nova's panel
# (frontend/src/panel/themes.js). The generator works out every other colour
# with the panel's own maths, and scripts/check_theme.py checks that text
# reaches 4.5:1 contrast on its card.
#
# Dark themes declare only a dark mode and light themes only a light mode, so
# Home Assistant layers its matching baseline underneath (this is what keeps
# card editor fields and dropdowns readable).
#
# Fonts need the Google Fonts resource in the README (Manrope, Fraunces and
# IBM Plex Mono). The card-mod keys are optional and are not validated by
# Home Assistant: check them by eye after a change.

Nova Deep Teal:
  # Fonts, shape and card-mod: the same in any mode.
  primary-font-family: "'Manrope', -apple-system, 'Segoe UI', sans-serif"  # older cards and the frontend still read this
  code-font-family: "'IBM Plex Mono', 'SF Mono', monospace"
  ha-font-family-body: "'Manrope', -apple-system, 'Segoe UI', sans-serif"
  ha-font-family-heading: "'Fraunces', Georgia, serif"  # Fraunces, as the panel's headings
  ha-font-family-code: "'IBM Plex Mono', 'SF Mono', monospace"
  ha-font-weight-heading: "600"
  ha-card-header-font-family: "'Fraunces', Georgia, serif"  # card titles in Fraunces, no card-mod needed
  ha-card-header-font-size: "22px"               # card title size
  ha-font-weight-action: "600"
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-border-radius-lg: "14px"
  ha-border-radius-xl: "20px"

  # card-mod (optional). Needs the card-mod or UIX HACS integration; Home Assistant ignores these keys without it.
  card-mod-theme: "Nova Deep Teal"               # must repeat this theme's own name exactly
  card-mod-sidebar: |
    ha-list-item-button {
      border-radius: 12px;
      margin: 2px 10px;
      transition: background .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    ha-list-item-button:hover {
      background: color-mix(in srgb, var(--primary-color) 10%, transparent);
    }
    ha-list-item-button:active {
      transform: scale(.98);
    }
    ha-list-item-button.selected {
      background: color-mix(in srgb, var(--primary-color) 18%, transparent);
      box-shadow: inset 3px 0 0 var(--accent-color), 0 0 18px -6px var(--accent-color);
    }

  card-mod-root: |
    .header {
      background: color-mix(in srgb, var(--app-header-background-color) 62%, transparent) !important;
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      backdrop-filter: blur(16px) saturate(1.3);
      border-bottom: 1px solid color-mix(in srgb, var(--accent-color) 32%, transparent);
      box-shadow: 0 10px 30px -18px color-mix(in srgb, var(--accent-color) 45%, transparent);
    }

  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      transition: box-shadow .25s ease, border-color .25s ease;
    }
    ha-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #7cb8ff, #8fffe0 55%, #8fffe0);
      opacity: .55;
      pointer-events: none;
    }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      ha-card {
        background: linear-gradient(180deg, #ffffff17, #ffffff08), color-mix(in srgb, var(--card-background-color) 46%, transparent);
        -webkit-backdrop-filter: blur(18px) saturate(1.35);
        backdrop-filter: blur(18px) saturate(1.35);
        border: 1px solid #ffffff29;
        box-shadow: 0 18px 40px -22px #000000cc, inset 0 1px 0 #ffffff24;
      }
      :host-context(ha-card) ha-card {
        background: var(--ha-card-background, var(--card-background-color));
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        border: 0;
        box-shadow: none;
      }
    }
    ha-card:hover {
      border-color: #8fffe070;
      box-shadow: 0 0 18px 1px #8fffe022;
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon) {
      transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease;
      cursor: pointer;
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -14px var(--accent-color), 0 0 0 1px color-mix(in srgb, var(--accent-color) 50%, transparent);
    }
    ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):active {
      transform: translateY(0) scale(.985);
      box-shadow: 0 4px 12px -8px var(--accent-color);
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon), ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):hover, ha-card:has(ha-tile-container, mushroom-card, mushroom-state-item, mushroom-shape-icon):active {
        transform: none;
        transition: none;
      }
    }

  modes:
    dark:
      # === Core palette ===
      primary-color: "#8fffe0"                               # accent seed
      accent-color: "#8fffe0"                                # accent as text
      dark-primary-color: "#72ccb3"                          # derived: accent, darkened
      light-primary-color: "#b1ffe9"                         # derived: accent, lightened
      primary-background-color: "#03313a"                    # page
      secondary-background-color: "#0f373f"                  # surface
      divider-color: "#3b5e65"                               # line-soft
      lovelace-background: "radial-gradient(900px 620px at 14% 8%,#8fffe038,transparent 62%),radial-gradient(760px 540px at 88% 18%,#86dfee5c,transparent 60%),radial-gradient(900px 760px at 58% 104%,#34797466,transparent 66%),linear-gradient(160deg,#30565d 0%,#03313a 52%,#021b20 100%)"  # page gradient with ambient glow
      primary-text-color: "#f0f3f3"                          # ink
      secondary-text-color: "#cfd7d9"                        # ink-dim
      disabled-text-color: "#a1b1b4"                         # ink-faint
      text-primary-color: "#152622"                          # text on the accent

      # === Sidebar ===
      sidebar-background-color: "#0f373f"
      sidebar-text-color: "#cfd7d9"
      sidebar-icon-color: "#cfd7d9"
      sidebar-selected-background-color: "#1f464d"
      sidebar-selected-icon-color: "#8fffe0"
      sidebar-selected-text-color: "#8fffe0"
      sidebar-divider-color: "#3b5e65"
      sidebar-badge-text-color: "#152622"

      # === App header ===
      app-header-background-color: "#0f373f"
      app-header-text-color: "#f0f3f3"
      app-header-edit-background-color: "#1f464d"

      # === Cards and dialogs ===
      card-background-color: "#0f373f"
      ha-card-background: "#0f373f"
      ha-card-border-color: "#3b5e65"
      ha-card-box-shadow: "0 8px 24px -14px #010c0f"
      ha-card-header-color: "#f0f3f3"
      dialog-background-color: "#0f373f"
      mdc-dialog-scrim-color: "#02191dcc"                    # derived: page, darkened

      # === Text fields and selects (card editors, form dialogs) ===
      input-fill-color: "#1f464d"
      input-disabled-fill-color: "#0f373f"
      input-ink-color: "#f0f3f3"
      input-label-ink-color: "#cfd7d9"
      input-disabled-ink-color: "#a1b1b4"
      input-idle-line-color: "#3b5e65"
      input-hover-line-color: "#8fffe0"
      input-outlined-idle-border-color: "#3b5e65"
      input-outlined-hover-border-color: "#8fffe0"
      input-outlined-disabled-border-color: "#3b5e65"
      input-dropdown-icon-color: "#cfd7d9"

      # === Form fields in newer components (ha-color tokens) ===
      ha-color-form-background: "#1f464d"
      ha-color-form-background-hover: "#2e5259"              # derived: field, towards text
      ha-color-form-background-disabled: "#0f373f"
      ha-color-text-primary: "#f0f3f3"
      ha-color-text-secondary: "#cfd7d9"
      ha-color-text-disabled: "#a1b1b4"
      ha-color-text-link: "#8fffe0"
      ha-color-focus: "#8fffe0"
      ha-color-fill-primary-loud-resting: "#8fffe0"
      ha-color-fill-primary-loud-hover: "#9fffe4"            # derived: accent, towards contrast
      ha-color-fill-primary-loud-active: "#aaffe7"           # derived: accent, towards contrast
      ha-color-on-primary-loud: "#152622"
      ha-color-fill-primary-normal-resting: "#2b6362"        # derived: surface and accent
      ha-color-on-primary-normal: "#8fffe0"
      ha-color-fill-primary-quiet-resting: "#1c4b4f"         # derived: surface and accent
      ha-color-on-primary-quiet: "#8fffe0"
      ha-color-border-primary-normal: "#8fffe0"
      ha-color-fill-neutral-quiet-resting: "#183f46"         # derived: surface, towards text
      ha-color-fill-neutral-quiet-hover: "#1f464d"
      ha-color-fill-neutral-normal-resting: "#3b5e65"
      ha-color-fill-neutral-loud-resting: "#a1b1b4"
      ha-color-border-neutral-quiet: "#3b5e65"
      ha-color-border-neutral-normal: "#a1b1b4"
      ha-color-border-neutral-loud: "#cfd7d9"
      ha-color-on-neutral-quiet: "#cfd7d9"
      ha-color-on-neutral-normal: "#f0f3f3"
      ha-color-on-neutral-loud: "#f0f3f3"

      # === Switches, sliders and Material components ===
      switch-checked-color: "#8fffe0"                        # accent, stepped to 3:1 so it shows on the card
      switch-checked-button-color: "#152622"
      switch-checked-track-color: "#8fffe066"                # derived: stepped accent at 40%
      switch-unchecked-button-color: "#a1b1b4"
      switch-unchecked-track-color: "#3b5e65"
      slider-color: "#8fffe0"                                # accent, stepped to 3:1
      slider-secondary-color: "#3b5e65"
      slider-bar-color: "#8fffe0"                            # accent, stepped to 3:1
      mdc-theme-primary: "#8fffe0"
      mdc-theme-secondary: "#8fffe0"
      mdc-theme-surface: "#0f373f"
      mdc-theme-background: "#03313a"
      mdc-theme-on-primary: "#152622"
      mdc-theme-on-secondary: "#152622"
      mdc-theme-on-surface: "#f0f3f3"

      # === State and semantic colours ===
      state-icon-color: "#cfd7d9"
      state-icon-active-color: "#8fffe0"
      state-active-color: "#8fffe0"
      state-inactive-color: "#a1b1b4"
      state-unavailable-color: "#a1b1b4"
      blue-color: "#7cb8ff"                                  # climate cool
      deep-orange-color: "#ff9a86"                           # climate heat
      orange-color: "#f4c860"                                # climate dry
      cyan-color: "#7cb8ff"                                  # climate fan only
      green-color: "#8fdc9c"                                 # climate auto
      amber-color: "#8fffe0"                                 # climate heat and cool
      error-color: "#ff9a86"
      warning-color: "#f4c860"
      success-color: "#8fdc9c"
      info-color: "#7cb8ff"

      # === Energy dashboard ===
      energy-solar-color: "#facc15"                          # c-solar, stepped to 3:1
      energy-grid-consumption-color: "#94a3b8"               # c-grid, stepped to 3:1
      energy-grid-return-color: "#7cb8ff"                    # info, stepped to 3:1
      energy-battery-out-color: "#8fffe0"                    # c-battery, stepped to 3:1
      energy-battery-in-color: "#8fdc9c"                     # good, stepped to 3:1

      # === Label badges and tables ===
      label-badge-red: "#ff9a86"
      label-badge-yellow: "#f4c860"
      label-badge-green: "#8fdc9c"
      label-badge-blue: "#7cb8ff"
      label-badge-grey: "#a1b1b4"
      label-badge-background-color: "#0f373f"
      label-badge-text-color: "#f0f3f3"
      table-row-background-color: "#0f373f"
      table-row-alternative-background-color: "#09343d"      # derived: surface and page

      # === RGB variants (opacity-aware components) ===
      rgb-primary-color: "143, 255, 224"                     # ember
      rgb-accent-color: "143, 255, 224"                      # gold
      rgb-primary-background-color: "3, 49, 58"              # bg
      rgb-secondary-background-color: "15, 55, 63"           # surface
      rgb-card-background-color: "15, 55, 63"                # surface
      rgb-primary-text-color: "240, 243, 243"                # ink
      rgb-secondary-text-color: "207, 215, 217"              # ink-dim
      rgb-disabled-text-color: "161, 177, 180"               # ink-faint
      rgb-state-inactive-color: "161, 177, 180"              # ink-faint
      rgb-error-color: "255, 154, 134"                       # bad
      rgb-warning-color: "244, 200, 96"                      # warn
      rgb-success-color: "143, 220, 156"                     # good
      rgb-info-color: "124, 184, 255"                        # info


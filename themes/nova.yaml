    }

  card-mod-card: |
    ha-card {
      position: relative;
      overflow: hidden;
      transition: box-shadow .25s ease, border-color .25s ease;
    }
    ha-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #235ddd, #c2185b 55%, #c2185b);
      opacity: .55;
      pointer-events: none;
    }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
